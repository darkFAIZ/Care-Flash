name: care_ui
description: "Shared design tokens, themes and reusable widgets for Care-Flash and Care-Merchant."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/i18n/
